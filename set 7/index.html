<!DOCTYPE html>
<html lang="en">
<head>
  <title>Float Property</title>
  <style>
    #container {
      height: 200px;
      width: 500px;
      background-color:palevioletred;
      border: 3px solid black;
    }
    .box {
      height: 150;
      width: 150;
      background-color:lightgreen;
      margin: 5px;
      border: 3px solid black;
      float: left;

    }
  </style>
</head>
<body>
  <div id="container">
    <div id="box1" class="box">Box1</div>
</body>
</html>
